[[mods]]
    modId="thikermagic"
    version="1.0.0"
    displayName="Thiker Magic"
    authors="YG"
    description='''
    Thiker Magic wires Ars Nouveau's mana and casting into Tinkers' Construct. Make a
    tool or a piece of armour out of Ars Nouveau materials and it comes with the matching
    trait: carry it or wear it and your mana ceiling, your mana regen and your cast
    cooldown all move with it.

    Every modifier is plain datapack JSON under data/thikermagic, so other packs can
    reference the same ids, re-point them with their own recipes, or hang them off their
    own tools. Ars Nouveau itself is optional - without it the attributes still register,
    they just have nothing to act on.
    '''

[[dependencies.thikermagic]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.0,21.2.0)"
    ordering="NONE"
    side="BOTH"

[[dependencies.thikermagic]]

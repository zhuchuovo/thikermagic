plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = 'com.yg.thikermagic'
version = "${minecraft_version}-${mod_version}"

base {
    archivesName = 'ThikerMagic'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { name = 'NeoForge'; url = 'https://maven.neoforged.net/releases' }
    maven { name = 'Parchment'; url = 'https://maven.parchmentmc.org' }
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
}

// Tinkers' Construct and Mantle come from the sibling checkouts, matching how the rest
// of this workspace builds addons. Ars Nouveau ships in this project folder.
def tconstructJar = file("../TinkersConstruct-1.21.1/build/libs/TinkersConstruct-1.21.1-${tconstruct_version}.jar")
def mantleJar = file("../Mantle-1.21.1/build/libs/Mantle-1.21.1-${mantle_version}.jar")
def arsNouveauJar = file("ars_nouveau-1.21.1-${ars_nouveau_version}.jar")

neoForge {
    version = project.neo_version
    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_version
    }

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            gameDirectory = file('run')
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        thikermagic { sourceSet sourceSets.main }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Compile-only so the published jar never bundles another mod's classes.
    compileOnly files(tconstructJar)
    compileOnly files(mantleJar)
    compileOnly files(arsNouveauJar)

    // Dev runtime needs the real mods present.
    localRuntime files(tconstructJar)
    localRuntime files(mantleJar)

    // JEI in the dev run, mirroring how Tinkers' own run is wired. The api artifacts are
    // compile-time only so the published jar never bundles JEI.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Ars Nouveau additionally requires Curios and GeckoLib at runtime, so it is only wired into
    // the dev runtime once those jars sit next to this file - otherwise the dev server refuses to
    // boot on the missing dependencies and the core of this addon cannot be tested at all.
    def arsExtraJars = fileTree(projectDir) {
        include 'curios-neoforge-*.jar'
        include 'geckolib-neoforge-*.jar'
    }
    if (!arsExtraJars.isEmpty()) {
        localRuntime files(arsNouveauJar)
        localRuntime arsExtraJars
    }
}

tasks.named('processResources', ProcessResources).configure {
    includeEmptyDirs = false
    def replaceProperties = [
            version: mod_version,
            loader_range: loader_range,
            minecraft_range: minecraft_range,
            neo_range: neo_range,
            tconstruct_range: tconstruct_range,
            mantle_range: mantle_range,
            ars_nouveau_range: ars_nouveau_range
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title': 'Thiker Magic',
                'Specification-Vendor': 'YG',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'YG'
        ])
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    // Tinkers' Construct, Mantle and Ars Nouveau are classpath jars, so their
    // annotations are not on the processor path.
    options.compilerArgs << '-Xlint:-processing'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) { from components.java }
    }
}
